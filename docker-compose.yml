# Development helpers for tuiper. Usage (Docker Desktop / any Linux engine):
#
#   docker compose run --rm dev                                 # interactive shell
#   docker compose run --rm dev go test ./internal/...          # tests
#   docker compose run --rm dev go vet ./...                    # vet
#   docker compose run --rm tuiper -engine test -demo           # TUI on loopback
#   docker compose run --rm tuiper -engine test -demo -watch 3s # headless MIDI check
#   docker compose run --rm tuiper -audio 3s                    # audio devices + capture meter (PipeWire)
#   docker compose run --rm tuiper -audio 3s -loopback          # capture -> playback round trip
#
# Every service starts with a private PipeWire session (audio + MIDI), so
# -engine rtmidi enumerates ALSA ports and -audio sees real (virtual) ALSA
# devices without host hardware.
#
# On a Linux host with real MIDI/audio hardware (ALSA):
#
#   docker compose --profile midi run --rm tuiper-alsa -engine rtmidi
name: tuiper

x-dev: &dev
  build: .
  image: tuiper-dev
  working_dir: /workspace
  entrypoint: ["/workspace/scripts/container-entrypoint.sh"]
  stdin_open: true
  tty: true
  environment:
    - TERM=xterm-256color
  volumes:
    - .:/workspace
    - go-build:/root/.cache/go-build
    - go-mod:/go/pkg/mod

services:
  # interactive shell / arbitrary commands: docker compose run --rm dev [cmd]
  dev:
    <<: *dev

  # tuiper itself: `docker compose run --rm tuiper [flags]`; a leading flag
  # is auto-wrapped into `go run ./cmd/tuiper` by the entrypoint script
  tuiper:
    <<: *dev

  # only useful on a Linux host; requires the `midi` profile. Same as above
  # but /dev/snd from the host is mounted, so rtmidi/-audio talk to the real
  # ALSA hardware instead of the in-container PipeWire devices.
  tuiper-alsa:
    <<: *dev
    profiles: ["midi"]
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio

volumes:
  # durable caches so every `compose run` is fast
  go-build:
  go-mod:
